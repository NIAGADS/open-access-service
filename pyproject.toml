
[project]
name = "open-access-service"
authors = [
    { name = "fossilfriend", email = "egreenfest@gmail.com" },
]
description = "Python services and shared libraries supporting the NIAGADS Open Access platform, including genomic data retrieval, annotation, API infrastructure, and data processing."
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.12,<3.14"
version = "2.0.0"


[tool.poetry]
homepage = "https://github.com/NIAGADS/open-access-service"
repository = "https://github.com/NIAGADS/open-access-service"
include = [
    { path = "bases/niagads/genomicsdb_etl/plugins/validation_schemas/*.json" },
    { path = "bases/niagads/genomicsdb_etl/plugins/validation_schemas/*.xsd" },
]
packages = [
    { include = "niagads/genomicsdb_etl", from = "bases" },
    { include = "niagads/metadata_validator_tool", from = "bases" },
    { include = "niagads/open_access_api", from = "bases" },
    { include = "niagads/pipeline_service", from = "bases" },
    { include = "niagads/sql_runner", from = "bases" },
    { include = "niagads/adsp_annotation", from = "components" },
    { include = "niagads/api", from = "components" },
    { include = "niagads/arg_parser", from = "components" },
    { include = "niagads/bed", from = "components" },
    { include = "niagads/cache", from = "components" },
    { include = "niagads/common", from = "components" },
    { include = "niagads/csv_parser", from = "components" },
    { include = "niagads/csv_triples_parser", from = "components" },
    { include = "niagads/csv_validator", from = "components" },
    { include = "niagads/database", from = "components" },
    { include = "niagads/decorators", from = "components" },
    { include = "niagads/enums", from = "components" },
    { include = "niagads/etl", from = "components" },
    { include = "niagads/excel_parser", from = "components" },
    { include = "niagads/exceptions", from = "components" },
    { include = "niagads/flatfile", from = "components" },
    { include = "niagads/ga4gh", from = "components" },
    { include = "niagads/genome_reference", from = "components" },
    { include = "niagads/json_validator", from = "components" },
    { include = "niagads/metadata_parser", from = "components" },
    { include = "niagads/metadata_serializer", from = "components" },
    { include = "niagads/metadata_validator", from = "components" },
    { include = "niagads/nlp", from = "components" },
    { include = "niagads/objects", from = "components" },
    { include = "niagads/parquet", from = "components" },
    { include = "niagads/postgres_dbi", from = "components" },
    { include = "niagads/rdf_parsers", from = "components" },
    { include = "niagads/requests", from = "components" },
    { include = "niagads/s3", from = "components" },
    { include = "niagads/sequence", from = "components" },
    { include = "niagads/settings", from = "components" },
    { include = "niagads/subprocess_manager", from = "components" },
    { include = "niagads/utils", from = "components" },
    { include = "niagads/vcf", from = "components" },
    { include = "niagads/vep_json_parser", from = "components" },
]

[tool.poetry.scripts]


[tool.poetry.dependencies]
aiohttp = { extras = [
    "speedups",
], version = "^3.11.16" }
boto3 = "^1.38.36"
email-validator = "^2.2.0"
httpx = "^0.28.1"
jsonschema = "^4.23.0"
lxml = "^6.0.2"
openpyxl = "^3.1.5"
pandas = "^2.2.3"
psutil = "^7.1.0"
pydantic = "^2.11.1"
pydantic-settings = "^2.8.1"
pyparsing = "^3.2.3"
python-dateutil = "^2.9.0.post0"
requests = "^2.32.3"
strenum = "^0.4.15"
typing-extensions = "^4.13.2"


[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
flake8 = "^7.0.0"
ipykernel = "^6.29.5"
isort = "^8.0.1"
lazydoc = "^1.0.1"
mypy = "^1.8.0"
pydocstyle = "^6.3.0"
pytest = "^8.2.2"

[tool.poetry.group.agents]
optional = true

[tool.poetry.group.agents.dependencies]
pydantic-ai-slim = { version = "2.57.0", extras = ["openrouter", "ui"] }
logfire = { version = "5.2.0", extras = ["fastapi", "httpx"] }

[tool.poetry.group.api]
optional = true

[tool.poetry.group.api.dependencies]
aiocache = { version = "^0.12.3", extras = ["redis"] }
asgi-correlation-id = "^4.3.4"
fastapi = "^0.136.3"
fastapi-cors = "^0.0.6"
itsdangerous = "^2.2.0"
nh3 = "^0.2.21"
pyyaml = "^6.0.2"
slowapi = "^0.1.9"
starlette = "^1.2.0"
uvicorn = "^0.35.0"
fastmcp = "^4.2.5"

[tool.poetry.group.postgres]
optional = true

[tool.poetry.group.postgres.dependencies]
asyncpg = "^0.30.0"
pgvector = "^0.4.2"
psycopg2-binary = "^2.9.11"
sqlalchemy = { version = "^2.0.40", extras = ["asyncio"] }
sqlalchemy-utils = "^0.43.0"

[tool.poetry.group.nlp]
optional = true

[tool.poetry.group.nlp.dependencies]
sentence-transformers = "^5.2.2"
spacy = "^3.8.11"
# Pinned this version for compatibility with the LFM2.5 embedding model.
transformers = "4.56.2"

[tool.poetry.group.rdf]
optional = true

[tool.poetry.group.rdf.dependencies]
oxrdflib = "^0.5.0"
rdflib = "^7.1.4"

[tool.poetry.group.streamlit]
optional = true

[tool.poetry.group.streamlit.dependencies]
streamlit = "^1.55.0"
wtforms = "^3.2.1"

[tool.poetry.group.variants]
optional = true

[tool.poetry.group.variants.dependencies]
cyvcf2 = "^0.31.1"
ga4gh-vrs = { version = "^2.2.0", extras = ["extras"] }
hgvs = { git = "https://github.com/NIAGADS/hgvs.git", rev = "NIAGADS" }
pysam = "^0.23.0"
vcfpy = "^0.13.8"

[tool.poetry.group.genomicsdb-etl]
optional = true
include-groups = ["postgres", "rdf", "nlp", "variants"]

[tool.poetry.group.oa-api]
optional = true
include-groups = ["api", "postgres", "agents"]



[tool.polylith.bricks]
"bases/niagads/genomicsdb_etl" = "niagads/genomicsdb_etl"
"bases/niagads/metadata_validator_tool" = "niagads/metadata_validator_tool"
"bases/niagads/open_access_api" = "niagads/open_access_api"
"bases/niagads/pipeline_service" = "niagads/pipeline_service"
"bases/niagads/sql_runner" = "niagads/sql_runner"
"components/niagads/adsp_annotation" = "niagads/adsp_annotation"
"components/niagads/api" = "niagads/api"
"components/niagads/arg_parser" = "niagads/arg_parser"
"components/niagads/bed" = "niagads/bed"
"components/niagads/cache" = "niagads/cache"
"components/niagads/common" = "niagads/common"
"components/niagads/csv_parser" = "niagads/csv_parser"
"components/niagads/csv_triples_parser" = "niagads/csv_triples_parser"
"components/niagads/csv_validator" = "niagads/csv_validator"
"components/niagads/database" = "niagads/database"
"components/niagads/decorators" = "niagads/decorators"
